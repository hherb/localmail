# Copy to ~/.config/localmail/config.toml (or set LOCALMAIL_CONFIG env var to point elsewhere).
#
# Secrets (passwords, OAuth refresh tokens) are NOT stored here.
# They live in the OS keyring under service "localmail", username "<account.name>"
# (and "<account.name>:refresh" for OAuth2 refresh tokens).

[database]
dsn = "postgresql://localmail:local%40%40mail@localhost:5532/localmail"
# URL-encode special characters in the password (e.g. '@' -> %40).

[attachments]
root = "~/localmail"

[daemon]
idle_renew_seconds = 1740   # re-issue IDLE before the 29-minute RFC 2177 ceiling
poll_seconds       = 300    # poll non-INBOX folders every 5 minutes
reload_seconds     = 30     # re-read accounts + reconcile threads this often (hot-reload)
shutdown_grace_seconds = 30 # per-thread join timeout on teardown / shutdown
# pool_max_size    = 12     # uncomment to override auto-computed pool cap
                            # (defaults to 2*N_accounts + workers + 2 + floor)
# startup_backoff_initial_s = 1.0   # wait-for-Postgres backoff at daemon launch
# startup_backoff_max_s     = 60.0  # cap for that exponential backoff
# A worker's heartbeat is considered "stale" when now() - last_heartbeat_at
# exceeds this many seconds. The daemon records per-thread liveness in the
# daemon_heartbeats table; an operator reads it via the admin daemon-status
# endpoint (2B.4). Both the IDLE and poll threads re-beat every ~30s (the poll
# thread even while idling between passes), so the default comfortably exceeds
# the beat interval independent of poll_seconds above.
heartbeat_stale_seconds = 120
# Bound (integer seconds) for the daemon's fresh, non-pool psycopg connects
# (startup account read, reconcile, heartbeat clear). Stops a network black-hole
# from blocking startup / hot-reload for the OS TCP default (minutes).
db_connect_timeout_s = 10
# Server-side query bound (integer seconds) for those same fresh connects,
# applied as Postgres statement_timeout. Catches a slow / stuck query (lock
# contention, a bad plan) — NOT a network black-hole (it's server-side: useless
# when the server never sees the query or the reply is dropped). These queries
# are sub-ms, so the default is generous headroom; set to 0 to disable.
db_statement_timeout_s = 30
# Post-connect network-black-hole bound (integer MILLISECONDS) for those same
# fresh connects, applied as libpq tcp_user_timeout: forces the socket closed
# after this much unacknowledged data. Unlike the two bounds above, this is the
# one that breaks a client stuck in recv when packets are dropped *after* the
# connect succeeds. Effective on Linux; libpq ignores it where TCP_USER_TIMEOUT
# is unavailable (e.g. macOS). Set to 0 to use the OS default (disable).
db_tcp_user_timeout_ms = 30000
# 2B.3 command queue: LISTEN the daemon_commands channel so an enqueued
# reload-now / restart-account / drain-stop wakes the reconcile loop early
# instead of waiting out reload_seconds. The poll path is authoritative; this
# is a latency optimization. Set command_listen_enabled = false to disable.
# command_listen_enabled = true
# command_listen_poll_seconds = 5.0
# Socket bound (seconds) for every blocking IMAP call the workers make — the
# IMAP-side analogue of the db_*_timeout knobs above. Unbounded, imapclient
# blocks forever on a network black-hole and the worker pins its pool
# connection and stops observing the stop event. This is a *per-recv* bound, so
# a slow-but-progressing bulk FETCH is safe. Raise it if an account livelocks
# in reconnect-with-backoff: a server-side stall with nothing on the wire (a
# Gmail SEARCH over a very large \All folder) looks the same as a black-hole
# and will otherwise time out on every retry. IDLE waits are unaffected.
imap_timeout_s = 60.0
# How long (seconds) sync keeps re-trying a UID whose FETCH returns no body
# while the message is still on the server. Holding the resume point is what
# makes a transient server hiccup recoverable instead of silently losing the
# message — but a zero-length or corrupt-store message is "still present"
# forever, so past this window sync logs a "giving up" WARNING and moves on.
# A successful fetch resets it, so this measures one continuous outage.
# A duration rather than an attempt count on purpose: the IDLE thread re-syncs
# INBOX on every notification, so a count would be spent at your mail volume.
# 0 disables holding entirely.
# max_body_fetch_hold_s = 1800.0

[serve]
# Admin UI signing keys. Required when admin UI is in use.
# Generate each with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# session_signing_key = "..."
# state_signing_key   = "..."
# oauth_callback_url  = "https://localmail.example.com/admin/oauth/callback"

# Daemon supervision (2B.4). When true (default) `localmail serve` owns
# `localmail run` as a child process and binds a Unix control socket the
# `localmail daemon {start,stop,restart}` CLI talks to. Set false for the
# systemd deployment where the supervisor owns `localmail run` independently —
# DB-mediated control (`daemon reload` / `restart-account`) and read-only
# `daemon status` still work; lifecycle ops report `external`.
# supervise_daemon = true
# Directory for the supervisor control socket (localmail-supervisor.sock, 0600).
# Empty = resolve from $XDG_RUNTIME_DIR, falling back to the platform temp dir.
# Security: the socket is the daemon control plane — anyone who can connect to
# it can start/stop/restart the daemon. The socket file is mode 0600, but its
# parent directory must not be world-writable; point runtime_dir at a per-user
# dir ($XDG_RUNTIME_DIR is 0700 and ideal). Do NOT use a shared/world-writable
# location like a bare /tmp on a multi-user host.
# runtime_dir = "/run/localmail"

[auth]
# Login rate-limit thresholds (all Postgres-backed; survive
# uvicorn --workers N and serve restarts).
login_per_user_max = 5
login_per_user_window_s = 60
login_per_ip_max = 20
login_per_ip_window_s = 60
login_global_max = 30
login_global_window_s = 60
login_attempt_retention_s = 86400  # 24h
login_cleanup_interval_s = 300     # 5m

# Reverse-proxy support. Empty (default) = use the socket peer.
# When set, X-Forwarded-For is peeled right-to-left, skipping entries
# in trusted_proxies, to find the originating client. See README.
# trusted_proxies = ["127.0.0.0/8"]                 # same-host proxy
# trusted_proxies = ["10.0.0.0/8", "127.0.0.0/8"]   # private-LAN proxy
# For a CDN/edge proxy (Cloudflare, Fastly, etc.) fetch the operator's
# current published IP ranges (e.g. https://www.cloudflare.com/ips/) —
# they change over time, don't hard-code stale CIDRs here.
# trusted_proxies_max_hops = 3

# Only required when at least one account uses auth_method = "oauth2".
# See README.md for how to obtain this file from Google Cloud Console.
[gmail_oauth]
client_secrets_file = "~/.config/localmail/gmail_client_secret.json"

[imports]
# Directories the /admin/imports UI may read archives from. Empty = imports
# disabled. Each path is realpathed; a source must resolve under one of these.
roots = []
# How often (in messages) the import worker flushes progress counters.
checkpoint_every = 50
# Also flush progress + poll for cancel at least this often (seconds), so a
# small-count but slow import (large attachments) stays responsive (issue #163).
checkpoint_seconds = 2
# A running job idle longer than this is shown stalled (red) in the panel.
stale_seconds = 60


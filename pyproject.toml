[project]
name = "localmail"
version = "0.1.0"
description = "Local PostgreSQL archive of one or more IMAP accounts."
authors = [
    { name = "Horst Herb" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "imapclient>=3.0",
    "keyring>=25",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "structlog>=24.1",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
localmail = "localmail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmail"]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
ignore_missing_imports = true

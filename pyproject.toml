[project]
name = "localmail"
version = "0.1.0"
description = "Local PostgreSQL archive of one or more IMAP accounts."
authors = [
    { name = "Horst Herb" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2",
    "click>=8.1",
    "fastembed>=0.8.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "html2text>=2024.2.26",
    "icalendar>=6.0",
    "imapclient>=3.0",
    "keyring>=25",
    "lingua-language-detector>=2.0",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pypdf>=6.12.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "striprtf>=0.0.26",
    "structlog>=24.1",
    "tiktoken>=0.13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "nh3>=0.2.18",
    "cryptography>=48.0.1",
    "sqlparse>=0.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.30",
]

[project.optional-dependencies]
extraction = [
    "docling>=2.94.0",
    # docling ships no OCR engine of its own, so a scanned PDF gets no text
    # unless one is installed (#248). ocrmac is a thin PyObjC wrapper around
    # Apple Vision: no torch, no model downloads, and native on the platform.
    # The marker keeps it off Linux, where `search.extractor_ocr_engine`'s
    # "auto" default simply finds no engine and degrades to no-OCR rather than
    # failing — install easyocr or rapidocr there to opt in.
    "ocrmac>=1.0 ; sys_platform == 'darwin'",
]
mcp = [
    "mcp>=1.13.0",
]

[dependency-groups]
dev = [
    "pikepdf>=9.0",
    "Pillow>=10.3",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "httpx>=0.27",
    "httpx2>=2.4",
]

[project.scripts]
localmail = "localmail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmail"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load real embedding/reranker models (opt-in)",
    "integration: tests requiring local services (opt-in via env)",
]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
ignore_missing_imports = true

[tool.uv.sources]
fastembed = { git = "https://github.com/qdrant/fastembed.git", rev = "87678dd784272f8e5d9fba034d7852d4233e58fd" }

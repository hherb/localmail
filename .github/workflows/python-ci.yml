name: python-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
      # The GUI manifests carry version literals that
      # tests/test_version_single_source.py pins against pyproject's. Without
      # these, a GUI-only bump would skip the job that guards them.
      - 'gui/package.json'
      - 'gui/src-tauri/Cargo.toml'
      - 'gui/src-tauri/tauri.conf.json'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
      - 'gui/package.json'
      - 'gui/src-tauri/Cargo.toml'
      - 'gui/src-tauri/tauri.conf.json'

jobs:
  pytest:
    name: pytest (PG ${{ matrix.postgres }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["pg18"]
        # Both, because the bug this matrix now guards is an interpreter
        # difference: CPython's structured-header parser raises for a
        # degenerate `Message-Id` on 3.12 and not on 3.13, and `requires-python`
        # still admits both. One leg alone cannot see a regression in the other.
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.postgres }}
        env:
          POSTGRES_USER: localmail
          POSTGRES_PASSWORD: 'local@@mail'
          POSTGRES_DB: localmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCALMAIL_TEST_DSN: postgresql://localmail:local%40%40mail@localhost:5432/localmail_test
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Pin Python via uv
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        # --extra mcp installs the (lightweight) MCP SDK so the MCP server
        # tests actually run in CI. The docling `extraction` extra is left
        # out deliberately (heavy ML deps); its tests importorskip docling.
        #
        # --locked, not --frozen: --frozen only skips the up-to-date check, so
        # a `uv.lock` disagreeing with `pyproject.toml` (including on the
        # version) installed happily and CI never noticed — and the later
        # `uv run pytest` silently re-locked it on the runner, so no test could
        # catch it either. --locked asserts the lockfile is current and fails
        # if it is not. See tests/test_version_single_source.py.
        #
        # --python pins the leg explicitly. `.python-version` (3.13) is read by
        # every uv command and beats UV_PYTHON, so without this flag the 3.12
        # leg would silently sync and test 3.13 and the matrix label would lie.
        run: uv sync --locked --python ${{ matrix.python }} --extra mcp
      - name: Cache embedding model
        # The real-model tests download google/embeddinggemma-300m (~1.2 GB) from
        # HuggingFace. The model is immutable, so a static key persists it across
        # runs: the first run populates the cache, later runs load from disk and
        # never call HF (avoiding the 429s GitHub Actions' shared IPs draw). A
        # cache miss just falls back to a download, which the test layer skips if
        # HF is unreachable. fastembed resolves via huggingface_hub (~/.cache/
        # huggingface) and may also stage under /tmp/fastembed_cache.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/fastembed_cache
          key: embedding-model-embeddinggemma-300m-onnx-v1
      - name: Run pytest
        # --python for the same reason as the sync step: `uv run` reads
        # `.python-version` too and would otherwise recreate the environment.
        run: uv run --python ${{ matrix.python }} pytest -q

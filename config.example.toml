# --- search -------------------------------------------------------------------

# All search tunables have sane defaults; this block is just for opt-ins.
# [search]
# Cross-encoder reranking is OFF by default. It is CPU-bound and the
# /v1/search cursor's grow_pool path doubles the pool on each page advance
# past the cache (50 → 100 → 200 → 400 → 800), which overruns request
# timeouts on CPU. Flip to true if you have a GPU and want re-ranked
# results on sort=rank queries.
# reranker_enabled = true

# `--smart` query rewrites are memoised in a bounded per-process LRU+TTL cache
# keyed on (today, free_text), so repeated identical smart queries skip a fresh
# Ollama call. On by default; set rewriter_cache_size = 0 to disable.
# rewriter_cache_size = 128     # max cached rewrites; 0 disables
# rewriter_cache_ttl_s = 1200   # entry lifetime in seconds

# Rewriter backend. "ollama" (default, local) | "openai" | "anthropic".
# Cloud backends use httpx directly (no SDK) and read their API key from an
# environment variable named below — never stored in this file or the DB. An
# unset key degrades to "no --smart".
# rewriter_backend = "ollama"
# rewriter_model = "granite4.1:3b-q8_0"   # set to match the chosen backend
# rewriter_max_tokens = 1024              # generated-token cap (openai/anthropic)
# OpenAI-compatible (OpenAI, OpenRouter, Together, Groq, vLLM, LM Studio,
# llama.cpp-server, Ollama's own /v1). base_url INCLUDES /v1 (OpenAI convention):
# rewriter_openai_base_url = "https://api.openai.com/v1"
# rewriter_openai_api_key_env = "OPENAI_API_KEY"
# Anthropic. base_url is origin only; the client appends /v1/messages:
# rewriter_anthropic_base_url = "https://api.anthropic.com"
# rewriter_anthropic_api_key_env = "ANTHROPIC_API_KEY"
# rewriter_anthropic_version = "2023-06-01"

# --- mcp server ---------------------------------------------------------------

# Mount the MCP (Model Context Protocol) server at /mcp inside `localmail serve`,
# exposing the archive's read surface to AI agents over Streamable HTTP. Off by
# default; opt in here AND install the optional extra (uv sync --extra mcp).
# Auth reuses api_tokens (Authorization: Bearer <token> from /v1/auth/login);
# every tool is scoped to the user's per-account grants. See docs/mcp-usage.md.
# [mcp]
# enabled = false              # mount the MCP server at /mcp inside `localmail serve`
#                              # (requires the optional extra: uv sync --extra mcp)
# issuer_url = "https://your-host:8443"          # advertised in RFC 9728 metadata
# resource_server_url = "https://your-host:8443" # public origin (NO /mcp suffix;
#                              # appended internally). Set to the externally
#                              # reachable URL so the metadata at
#                              # /.well-known/oauth-protected-resource/mcp and the
#                              # 401 WWW-Authenticate challenge agree.
# authorization_servers = ["https://your-host:8443"]   # required PRM field;
#                              # defaults to [issuer_url] when unset. Point at a
#                              # real external authorization server only if one
#                              # mints tokens this server accepts — localmail
#                              # itself is not an OAuth authorization server.
# NOTE: when fronting localmail externally, set issuer_url (and, if you don't
# override authorization_servers, it follows issuer_url) to the same external
# origin as resource_server_url — otherwise the metadata advertises a localhost
# authorization server alongside your real resource URL.

# --- upgrade preflight --------------------------------------------------------

# Throughput rates used by `localmail estimate-upgrade` to project how long
# lock-heavy migrations (e.g. 0006) will hold against a populated `messages`
# table. Defaults assume SSD + modern Postgres. Halve for HDD / low-memory
# hosts; double for NVMe + lots of RAM. See docs/operations/upgrade-runbook.md.
# [upgrade]
# fts_v2_blowup_factor      = 1.5    # tsvector size vs. raw text
# gin_size_factor           = 0.4    # GIN index size vs. covered column
# table_rewrite_mb_per_sec  = 80.0   # ADD COLUMN GENERATED STORED throughput
# gin_build_mb_per_sec      = 30.0   # CREATE INDEX GIN throughput

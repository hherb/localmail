[project]
name = "localmail"
version = "0.1.0"
description = "Local PostgreSQL archive of one or more IMAP accounts."
authors = [
    { name = "Horst Herb" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "imapclient>=3.0",
    "keyring>=25",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "structlog>=24.1",
    "click>=8.1",
    "tiktoken>=0.13.0",
    "fastembed>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
localmail = "localmail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmail"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load real embedding/reranker models (opt-in)",
    "integration: tests requiring local services (opt-in via env)",
]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
ignore_missing_imports = true

[tool.uv.sources]
fastembed = { git = "https://github.com/qdrant/fastembed.git", rev = "87678dd784272f8e5d9fba034d7852d4233e58fd" }

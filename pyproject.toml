[project]
name = "localmail"
version = "0.3.0"
description = "Local PostgreSQL archive of one or more IMAP accounts."
authors = [
    { name = "Horst Herb" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2",
    # 8.2 is the floor the *tests* need, not the runtime: `CliRunner` gained
    # separately-captured stderr there (`mix_stderr` removed), and #291's
    # diagnostic is asserted on `result.stderr`. On 8.1 those tests raise
    # `ValueError: stderr not separately captured` rather than fail honestly.
    "click>=8.2",
    # 0.9.1 is the first PyPI release carrying both the EmbeddingGemma support
    # we used to take from a git rev (PR #592) and the `pillow<14` widening
    # (PR #830) that unblocks the floor below. Embeddings and rerank scores
    # were verified bit-identical to the git rev before the source was dropped.
    "fastembed>=0.9.1",
    # Transitive via fastembed and docling, declared for the `transformers`
    # reason: Dependabot #139–#181 (5 CRITICAL, 23 HIGH) against < 13.0.0, and
    # the lock sat at 12.3.0. fastembed (< 0.9.1) and docling (< 2.142) both
    # capped it below 13, which is what held this open. A scanned PDF's
    # embedded JPEG was measured not to reach `PIL.Image.open` (pdfium decodes
    # it), so this is hygiene, not an incident; re-measure after a docling bump.
    "pillow>=13.0.0",
    # Transitive via huggingface-hub and torch, declared for the `transformers`
    # reason: Dependabot #182 (HIGH) and #183/#184 (LOW), < 4.2.1. All three
    # are in `ReadWriteLock`/`SoftFileLock` or Windows-only, and only the model
    # cache takes a lock here, so hygiene.
    "filelock>=4.2.1",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    # Transitive via google-auth-oauthlib → requests-oauthlib, and declared
    # for the reason `transformers` is: there was no floor to read the range
    # against and the lock sat inside it (3.3.1). Dependabot #84 (JSONP
    # callback injection in `RevocationEndpoint`) and #85 (PKCE verifier
    # timing) are both in oauthlib's *server* endpoints; localmail is only
    # ever the OAuth *client* here (`oauth-login` and the admin Connect
    # flow), so this is hygiene, not an incident. 4.0.0 is a major release;
    # the consent URL and the token-exchange request both flows build were
    # verified identical across the bump.
    "oauthlib>=4.0.0",
    "html2text>=2024.2.26",
    # Floor is security-driven, and the floor is what fixes it: GHSA
    # (Dependabot #66) is algorithmic complexity in `Component.__eq__`,
    # HIGH, against `>= 7.1.0, < 7.1.3`. The old `>=6.0` floor reads as
    # unaffected and is not — the vulnerable window sits ABOVE it, and a
    # resolver picking the newest compatible release lands inside it, which
    # is exactly where the lock was (7.1.0). Unlike sqlparse below, the
    # input here IS attacker-controlled: `_extract_ics` runs
    # `Calendar.from_ical` over an ICS emailed to the archive.
    "icalendar>=7.1.3",
    "imapclient>=3.0",
    "keyring>=25",
    "lingua-language-detector>=2.0",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    # Floor is security-driven: three DoS advisories against < 6.16.1
    # (Dependabot #67/#68/#69) — an infinite loop in
    # `TreeObject.insert_child`, and unbounded runtime/memory when
    # retrieving outlines and when extracting XForm objects. The last is on
    # our own hot path: `_extract_pdf` calls `page.extract_text()` over a
    # PDF emailed to the archive, so the input is attacker-controlled. The
    # blast radius was already bounded (a hostile PDF costs one extraction
    # slot, then poison-pills under #153's transient budget), which is why
    # this is a floor bump and not an incident. Raised again for eight more
    # DoS advisories of the same family (Dependabot #105–#112, HIGH: page
    # labels, indirect objects, /ToUnicode and font data, FlateDecode
    # streams, embedded files, appearance streams), the last fixed in
    # 6.19.0. Same reachability — an emailed PDF — and same verification:
    # extraction byte-identical across the bump. Raised to 6.21.1 for
    # Dependabot #148 (LOW, unvalidated JPEG data loading), which needs
    # `page.images`; `_extract_pdf` never calls it, so that one is hygiene.
    "pypdf>=6.21.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "striprtf>=0.0.26",
    "structlog>=24.1",
    "tiktoken>=0.13.0",
    "fastapi>=0.115",
    # Declared because we import it (`anyio.to_thread` in serve/ and mcp/),
    # and the floor is security-driven: Dependabot #80 (CRITICAL, TLSStream
    # IDNA-2003 host-name encoding → certificate spoofing) and #79 (process-
    # pool workers block on undrained stderr), both `< 4.14.2`. It arrived
    # only transitively via fastapi/starlette/mcp, so like `transformers` there
    # was no floor to read the range against — the lock held 4.13.0. Neither
    # surface is on our path (no outbound anyio TLS: serve's TLS is uvicorn
    # over stdlib ssl, the rewriter is sync httpx; no process pools), so this
    # is hygiene, not an incident.
    "anyio>=4.14.2",
    "uvicorn[standard]>=0.32",
    # Transitive via requests (fastembed's and docling's model downloads,
    # the OAuth token exchange), declared so the floor governs re-resolution:
    # Dependabot #94–#96 (two HIGH) against < 2.8.0. Its peers are Google, the
    # Hugging Face hub and rapidocr's model host (modelscope.cn) — nothing
    # mail-borne reaches it — so this is hygiene, not an incident.
    "urllib3>=2.8.0",
    # The CA bundle behind requests and httpx, declared for the
    # `transformers` reason: Dependabot #138 (CRITICAL), compromised emSign
    # intermediates. 2026.10.19 drops one root, emSign ECC Root CA - G3. It
    # governs the HTTPS paths (Google OAuth, model downloads, the cloud
    # rewriters), never a mail-borne input. It does NOT govern IMAP:
    # imapclient uses ssl.create_default_context(), i.e. the OS store, which
    # still carries G3 on both hosts (see CLAUDE.md).
    "certifi>=2026.10.19",
    # Transitive via huggingface-hub (fastembed, docling), declared for the
    # `transformers` reason. Dependabot #117 (HIGH) is template injection in
    # `ReferenceFileSystem`, which only a `reference://` URL or a
    # Kerchunk document reaches; nothing here opens either, so hygiene.
    "fsspec>=2026.6.0",
    "argon2-cffi>=23.1",
    "nh3>=0.2.18",
    "cryptography>=50.0.0",  # floor is security-driven: CVE-2026-69247 (Dependabot #57)
    # Floor is security-driven: three HIGH ReDoS/quadratic-DoS advisories
    # and one string-breakout advisory against <= 0.5.5, all fixed in
    # 0.6.0. Only consumer is db._split_statements over our own migration
    # files, so nothing attacker-controlled reaches it — the floor is
    # hygiene, not an incident. Verified splits byte-identically across
    # every migration on disk before bumping.
    "sqlparse>=0.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.30",
]

[project.optional-dependencies]
extraction = [
    # Floor is security-driven: Dependabot #116 and #118–#131 (docling and
    # docling-slim, which each release pins to its own version), all fixed by
    # 2.132.0. Every one is in a non-PDF backend or remote fetch, which
    # `extractor._pdf_only_converter_kwargs` already makes unreachable (#399),
    # so this is hygiene. It moves docling-ibm-models 3 → 4 (new layout
    # models); verified by `tests/acceptance/probe_docling_ocr.py` against
    # main under rapidocr and ocrmac — see CLAUDE.md. The lock holds 2.142.1
    # (`-P 'docling==2.142.1' -P 'docling-slim==2.142.1'`): 2.143.x and 2.144.0
    # drop the Qty column of the probe's native table under rapidocr, and a
    # bare `uv lock --upgrade` lands there.
    "docling>=2.132.0",
    # docling ships no OCR engine of its own, so a scanned PDF gets no text
    # unless one is installed (#248). ocrmac is a thin PyObjC wrapper around
    # Apple Vision: no torch, no model downloads, and native on the platform.
    # The marker keeps it off Linux, where `search.extractor_ocr_engine`'s
    # "auto" default finds rapidocr instead (below).
    "ocrmac>=1.0 ; sys_platform == 'darwin'",
    # Transitive via docling, and the engine "auto" picks on Linux. Capped
    # because docling's own range (>=3.9.1,<4) admits 3.10.0, which removed
    # `COMMON_LANG_ALIASES`/`PP_OCRV6_LANGS` from `rapidocr.utils.model_resolver`
    # — docling 2.118.1's `rapid_ocr_model` imports both, so every OCR pass
    # raised ImportError (an ExtractorConfigurationError here, #248) and every
    # scanned PDF on the DGX would have exhausted its transient budget.
    # docling >= 2.132 reads `list_supported_langs` instead and tolerates 3.10,
    # so the cap is now conservative rather than required. Lifting it moves
    # rapidocr to `opencv-python-headless`, so do that with its own OCR probe.
    "rapidocr>=3.9.1,<3.10",
    # Transitive via rapidocr, uncapped there; docling-ibm-models (3.13.2 and
    # 4.0.3, TableFormer) declares opencv <5 and imports cv2 directly, so the cap
    # restores the range the package that uses it states. 5.0 is a major.
    "opencv-python>=4.6,<5",
    # Transitive via docling (which runs its layout models through it) and
    # never imported by localmail — `grep -rn transformers src/` is empty. The
    # floor is security-driven and declared anyway, because the lock alone is
    # not the constraint: CVE-2026-9856 (HIGH, Dependabot #70) covers
    # < 5.10.0, and the lock sat at 5.8.1, squarely inside it. The advisory is
    # a path traversal in `save_pretrained` via chat-template names — a *write*
    # path nothing here calls — so this is the sqlparse case (hygiene, not an
    # incident), not the pypdf/icalendar one where the input is an attachment.
    # Declared so a re-resolution cannot land back inside the range; listing a
    # package we do not import follows ocrmac above, which is here for the same
    # reason: it shapes what docling does.
    "transformers>=5.10.0",
    # Transitive via torch, declared for the `transformers` reason: Dependabot
    # #179 (LOW), a Windows path escape during legacy wheel installation.
    # Neither host is Windows and nothing installs wheels at runtime: hygiene.
    "setuptools>=84.1.0",
]
mcp = [
    # Floor is security-driven: Dependabot #132, unbounded session
    # accumulation in Streamable HTTP's *stateful* mode, < 1.30.0. localmail
    # mounts with `stateless_http=True`, which the advisory exempts, so this
    # is hygiene. Held on 1.x by the lock only (`-P 'mcp==1.30.0'`): no upper
    # bound here, so a bare `uv lock --upgrade` lands on 2.x.
    "mcp>=1.30.0",
    # `mcp` requires `pyjwt[crypto]`, and only the SDK's *client* credentials
    # extension imports it — the server localmail mounts never does; the lazy
    # imports in oauthlib and google-auth's `id_token` are unused here — so
    # Dependabot #81–#83 and #86–#93/#97/#98 (one CRITICAL) are hygiene.
    # Declared for the `transformers` reason: no floor, and the lock at
    # 2.13.0 sat inside every range. 2.15.0 is the last fix (#97).
    "pyjwt>=2.15.0",
]

[dependency-groups]
dev = [
    "pikepdf>=9.0",
    "Pillow>=13.0.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "httpx>=0.27",
    # Dev-only (Starlette TestClient, #192). 2.12.0 is a security floor
    # (Dependabot #73-#75); it pins httpcore2 exactly, which carries that
    # past its own advisory (#72, fixed in 2.10.0).
    "httpx2>=2.12.0",
]

[project.scripts]
localmail = "localmail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmail"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load real embedding/reranker models (opt-in)",
    "integration: tests requiring local services (opt-in via env)",
]
# A leaked connection pool surfaces only as this warning, from a finaliser, on
# whichever unrelated test the GC happened to interrupt (#321) — so the whole
# evidence that the autouse pool-closing fixture still works was a human
# comparing warning counts between runs, and the leak is invisible on macOS
# while reported on Linux/3.13. Escalating it is what makes a regression turn
# CI red. The test it fails is arbitrary; the message ("cannot join current
# thread") is the diagnosis. The two known `websockets` deprecations (#25) are
# DeprecationWarnings and are unaffected.
#
# A worker thread that dies on startup is otherwise invisible: the daemon tests
# assert on `threading.enumerate()`, and `Thread.start()` returns once the thread
# is *registered* — before its target has run a line — so a name lookup passes
# for a thread that raises microseconds later (measured: listed 50/50). The
# `time.sleep()` calls those tests used to carry caught it only incidentally and
# only probabilistically; escalating the exception itself is deterministic and
# needs no timer. Same reasoning as the entry above, one thread-channel over.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
ignore_missing_imports = true


[project]
name = "localmail"
version = "0.1.0"
description = "Local PostgreSQL archive of one or more IMAP accounts."
authors = [
    { name = "Horst Herb" }
]
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2",
    "click>=8.1",
    "fastembed>=0.8.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "html2text>=2024.2.26",
    "icalendar>=6.0",
    "imapclient>=3.0",
    "keyring>=25",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pypdf>=6.7.2",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "striprtf>=0.0.26",
    "structlog>=24.1",
    "tiktoken>=0.13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "bleach[css]>=6.2",
    "cryptography>=43.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
extraction = [
    "docling>=2.20",
]

[dependency-groups]
dev = [
    "pikepdf>=9.0",
    "Pillow>=10.3",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "reportlab>=4.0",
    "httpx>=0.27",
]

[project.scripts]
localmail = "localmail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localmail"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load real embedding/reranker models (opt-in)",
    "integration: tests requiring local services (opt-in via env)",
]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "src"
ignore_missing_imports = true

[tool.uv.sources]
fastembed = { git = "https://github.com/qdrant/fastembed.git", rev = "87678dd784272f8e5d9fba034d7852d4233e58fd" }

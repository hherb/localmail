name: python-ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-ci.yml'

jobs:
  pytest:
    name: pytest (PG ${{ matrix.postgres }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["pg18"]
        python: ["3.12"]
    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.postgres }}
        env:
          POSTGRES_USER: localmail
          POSTGRES_PASSWORD: 'local@@mail'
          POSTGRES_DB: localmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCALMAIL_TEST_DSN: postgresql://localmail:local%40%40mail@localhost:5432/localmail_test
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Pin Python via uv
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        # --extra mcp installs the (lightweight) MCP SDK so the MCP server
        # tests actually run in CI. The docling `extraction` extra is left
        # out deliberately (heavy ML deps); its tests importorskip docling.
        run: uv sync --frozen --extra mcp
      - name: Cache embedding model
        # The real-model tests download google/embeddinggemma-300m (~1.2 GB) from
        # HuggingFace. The model is immutable, so a static key persists it across
        # runs: the first run populates the cache, later runs load from disk and
        # never call HF (avoiding the 429s GitHub Actions' shared IPs draw). A
        # cache miss just falls back to a download, which the test layer skips if
        # HF is unreachable. fastembed resolves via huggingface_hub (~/.cache/
        # huggingface) and may also stage under /tmp/fastembed_cache.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/fastembed_cache
          key: embedding-model-embeddinggemma-300m-onnx-v1
      - name: Run pytest
        run: uv run pytest -q

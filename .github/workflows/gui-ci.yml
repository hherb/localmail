name: gui-ci

on:
  push:
    branches: [main]
    paths:
      - 'gui/**'
      - '.github/workflows/gui-ci.yml'
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui-ci.yml'

defaults:
  run:
    working-directory: gui

jobs:
  frontend:
    name: svelte-check + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  tauri-rust:
    name: cargo test + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux system deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
          key: ${{ matrix.os }}
      - name: cargo test
        working-directory: gui/src-tauri
        run: cargo test --locked
      - name: cargo clippy
        working-directory: gui/src-tauri
        run: cargo clippy --locked -- -D warnings
